<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Disfraz para gatos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        img {
            width: 100%;
            border-radius: 15px;
        }

        .contenido {
            background: white;
            padding: 30px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <div class="contenido">

        <h1>🐱 El disfraz más elegante del barrio</h1>

        <img src="https://placecats.com/500/350" alt="Un gato">

        <h2>¿Qué necesitas?</h2>

        <ul>
            <li>Una tela suave</li>
            <li>Tijeras</li>
            <li>Cinta métrica</li>
        </ul>

        <h2>Pasos</h2>

        <ol>
            <li>Mide suavemente el cuerpo de tu gato.</li>
            <li>Corta la tela dejando espacio suficiente.</li>
            <li>Comprueba que el disfraz no quede apretado.</li>
            <li>¡Listo! Tu gato tiene su disfraz.</li>
        </ol>

    </div>

</body>
</html>
